<title>Life Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d111c; --panel:#161d2f; --panel2:#1d2740; --line:#2a3654;
  --ink:#e7ecf7; --muted:#8b97b5; --good:#37d67a; --bad:#ff5d6c; --gold:#ffd24a;
  --accent:#e62429; --accent2:#1f6feb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Rajdhani',system-ui,sans-serif;font-size:17px;overscroll-behavior:none}
body{background:
  radial-gradient(900px 500px at 80% -10%, color-mix(in srgb,var(--accent) 16%,transparent), transparent 60%),
  radial-gradient(700px 500px at -10% 8%, color-mix(in srgb,var(--accent2) 14%,transparent), transparent 55%),
  var(--bg); min-height:100vh}
h1,h2,h3{font-family:'Orbitron',sans-serif;letter-spacing:.5px;margin:0}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 96px}
button{font-family:'Rajdhani',sans-serif;cursor:pointer}

/* HUD */
.hud{position:sticky;top:0;z-index:20;margin:-14px -14px 8px;padding:16px 14px 10px;
  background:linear-gradient(180deg,var(--bg) 72%,transparent)}
.hud-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stage-badge{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));
  border-radius:13px;padding:8px 12px;font-family:'Orbitron';font-weight:900;color:#fff;line-height:1;text-align:center;flex:0 0 auto}
.stage-badge small{display:block;font-size:9px;font-weight:700;letter-spacing:2px;opacity:.85;margin-bottom:3px}
.stage-badge b{font-size:20px}
.res{display:flex;gap:6px;margin-bottom:8px}
.res .r{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:6px 7px}
.res .r .lab{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.res .r .val{font-family:'Orbitron';font-weight:700;font-size:15px;display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden}
.res .charge .val{color:#5bd1ff}.res .exp .val{color:#b69bff}.res .gold .val{color:#ffcf5a}.res .dust .val{color:#5fe0c8}
.gear{background:var(--panel);border:1px solid var(--line);color:var(--muted);width:40px;height:40px;border-radius:12px;font-size:18px;flex:0 0 auto}
.rate{font-size:12px;color:var(--muted);font-weight:600;text-align:center;letter-spacing:.4px}
.rate b{color:#5bd1ff}

/* sub tabs */
.tabs{display:flex;gap:6px;margin:6px 0 12px;background:var(--panel);padding:5px;border-radius:13px;border:1px solid var(--line)}
.tabs button{flex:1;background:none;border:none;color:var(--muted);padding:9px 4px;border-radius:9px;font-weight:700;font-size:14px;letter-spacing:.3px}
.tabs button.on{background:var(--accent);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 45%,transparent)}

.head{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
.head h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
.add{background:var(--panel);border:1px solid var(--line);color:var(--accent2);font-weight:700;border-radius:10px;padding:7px 13px;font-size:14px}
.list{display:flex;flex-direction:column;gap:9px}

/* task cards */
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:14px;padding:12px;display:flex;align-items:center;gap:11px;animation:rise .35s both}
.card .diff{width:5px;align-self:stretch;border-radius:4px;flex:0 0 auto}
.diff.easy{background:#5bd1ff}.diff.med{background:#ffc24a}.diff.hard{background:#ff6b8a}
.card .body{flex:1;min-width:0}
.card .t{font-weight:600;font-size:17px;line-height:1.15;word-break:break-word}
.card .meta{color:var(--muted);font-size:13px;font-weight:600;margin-top:2px}
.card.done .t{text-decoration:line-through;opacity:.5}
.btnset{display:flex;gap:7px;flex:0 0 auto}
.sq{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);font-size:20px;font-weight:800;display:grid;place-items:center;color:var(--ink)}
.sq.plus{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.sq.minus{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:18px;color:var(--good)}
.chk.on{background:color-mix(in srgb,var(--good) 22%,transparent);border-color:var(--good)}
.empty{color:var(--muted);text-align:center;padding:24px 12px;font-size:15px;font-weight:600;border:1px dashed var(--line);border-radius:14px;line-height:1.5}

/* roster */
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hero{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;
  padding:10px;text-align:center;position:relative;animation:rise .35s both}
.hero.inteam{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), 0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.hero .ava{width:100%;aspect-ratio:1;border-radius:11px;display:grid;place-items:center;font-family:'Orbitron';font-weight:900;font-size:26px;color:#fff;overflow:hidden;margin-bottom:7px}
.hero .ava img{width:100%;height:100%;object-fit:contain}
.hero .hn{font-weight:700;font-size:14px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .hr{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.hero .lv{position:absolute;top:6px;left:6px;background:#000a;border:1px solid var(--line);border-radius:7px;font-size:11px;font-weight:800;padding:2px 6px;font-family:'Orbitron'}
.hero .star{position:absolute;top:6px;right:6px;font-size:14px}
.hero.add-hero{display:grid;place-items:center;border-style:dashed;color:var(--accent2);font-weight:700;min-height:120px}
.hero.add-hero span{font-size:30px;line-height:1}

/* campaign */
.team-strip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.team-strip .lab{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:9px;display:flex;justify-content:space-between}
.team-strip .lab b{color:var(--ink);font-family:'Orbitron'}
.team-row{display:flex;gap:8px}
.team-row .slot{flex:1;aspect-ratio:1;border-radius:11px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;overflow:hidden;background:var(--bg)}
.team-row .slot.full{border-style:solid}
.team-row .slot .ava{width:100%;height:100%;display:grid;place-items:center;font-family:'Orbitron';font-weight:900;color:#fff;font-size:20px}
.team-row .slot .ava img{width:100%;height:100%;object-fit:contain}
.fight{width:100%;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#000));color:#fff;border:none;border-radius:14px;padding:16px;font-family:'Orbitron';font-weight:900;font-size:17px;letter-spacing:1px;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent)}
.fight:disabled{filter:grayscale(.7) brightness(.7)}
.stagecard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;text-align:center}
.stagecard h3{font-size:22px}.stagecard p{color:var(--muted);font-weight:600;margin:4px 0 0;font-size:14px}

/* battle arena */
.arena{position:fixed;inset:0;z-index:70;background:
  radial-gradient(700px 380px at 50% 0%, color-mix(in srgb,var(--accent) 22%,transparent), transparent 65%), #07090f;
  display:none;flex-direction:column;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}
.arena.show{display:flex;animation:fade .25s}
.arena .vs-head{text-align:center;font-family:'Orbitron';font-weight:900;letter-spacing:2px;color:var(--muted);font-size:13px;margin-bottom:14px}
.side{flex:1;display:flex;flex-direction:column;justify-content:center;gap:9px}
.side.enemy .unit{flex-direction:row-reverse;text-align:right}
.vs-mid{text-align:center;font-family:'Orbitron';font-weight:900;color:var(--accent);font-size:26px;margin:6px 0;text-shadow:0 0 20px color-mix(in srgb,var(--accent) 60%,transparent)}
.unit{display:flex;align-items:center;gap:10px;transition:transform .12s}
.unit.hit{transform:translateX(8px)}
.unit.enemy.hit{transform:translateX(-8px)}
.unit .face{width:60px;height:60px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;font-family:'Orbitron';font-weight:900;color:#fff;font-size:22px;overflow:hidden;border:1px solid #fff2}
.unit .face img{width:100%;height:100%;object-fit:contain}
.unit.dead{opacity:.25;filter:grayscale(1)}
.unit .info{flex:1;min-width:0}
.unit .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .hpbar{height:9px;border-radius:6px;background:#1c2336;overflow:hidden;margin-top:4px;border:1px solid #ffffff14}
.unit .hpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--good),#9ff0bb);transition:width .25s}
.unit.enemy .hpbar i{background:linear-gradient(90deg,var(--bad),#ffb0b8)}
.dmg{position:absolute;font-family:'Orbitron';font-weight:900;font-size:16px;color:#fff;text-shadow:0 2px 6px #000;pointer-events:none;animation:dmgfloat .8s ease-out forwards}
.arena .result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;text-align:center;padding:22px 24px;background:rgba(7,9,15,.94);border:1px solid var(--line);border-radius:18px;min-width:250px;max-width:88%;box-shadow:0 24px 60px #000b}
.arena .result h2{font-size:30px;margin-bottom:6px}
.arena .result.win h2{color:var(--good)}.arena .result.lose h2{color:var(--bad)}
.arena .result p{color:var(--muted);font-weight:600}
.arena .result button{margin-top:12px;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px 24px;font-family:'Orbitron';font-weight:700}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--panel);
  border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;border:none;color:var(--muted);font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.5px}
.nav button .ic{font-size:21px}
.nav button.on{color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;background:#050811cc;backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:80}
.scrim.show{display:flex;animation:fade .2s}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:none;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
.sheet h3{font-size:18px;margin-bottom:14px}
.sheet label{display:block;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin:0 0 6px}
.sheet input[type=text],.sheet input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:12px;font-size:17px;font-weight:600;margin-bottom:14px;font-family:'Rajdhani'}
.segs{display:flex;gap:8px;margin-bottom:16px}
.segs button{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--muted);padding:10px 4px;border-radius:11px;font-weight:700;font-size:13px}
.segs button.on{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.go{width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px;font-family:'Orbitron';font-weight:700;font-size:15px;letter-spacing:.5px;margin-top:4px}
.ghost{width:100%;background:none;color:var(--bad);border:none;padding:11px;font-weight:700;font-size:15px;margin-top:6px}
.themegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:8px}
.themegrid button{padding:13px 6px;border-radius:13px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px}
.swatch{width:34px;height:18px;border-radius:6px}
.avapick{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avapick .prev{width:64px;height:64px;border-radius:13px;display:grid;place-items:center;font-family:'Orbitron';font-weight:900;color:#fff;font-size:24px;overflow:hidden;flex:0 0 auto;border:1px solid var(--line)}
.avapick .prev img{width:100%;height:100%;object-fit:contain}
.avapick .up{flex:1}
.avapick .up button{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:11px;font-weight:700;font-size:14px}
.avapick .up small{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.colordots{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.colordots button{width:32px;height:32px;border-radius:50%;border:2px solid transparent}
.colordots button.on{border-color:#fff}
.lvlcost{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.lvlcost .c{color:var(--gold);font-family:'Orbitron'}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.statgrid div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.statgrid .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.statgrid .v{font-family:'Orbitron';font-weight:700;font-size:18px}

.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:11px 18px;border-radius:13px;font-weight:700;z-index:95;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 30px #0007;font-size:15px;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes dmgfloat{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-34px)}}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent}40%{box-shadow:0 0 0 3px var(--good)}}
.flashgood{animation:flash .5s}

/* battle motion — single image per hero, animated by code */
.unit{position:relative}
.unit .face{position:relative;animation:idlebob 2.4s ease-in-out infinite}
.unit.dead .face{animation:none}
.side.player .unit.lunge{transform:translateX(26px) scale(1.05)}
.side.enemy .unit.lunge{transform:translateX(-26px) scale(1.05)}
.unit.struck .face{animation:struck .3s}
.unit.dying .face{animation:die .55s forwards}
.fx.slash{position:absolute;inset:0;border-radius:11px;box-shadow:0 0 0 3px #fff inset,0 0 18px #fff9;animation:slashfx .34s ease-out forwards;pointer-events:none}
.arena.shake{animation:shake .26s}
.team-row .slot.full .ava{animation:idlebob 2.6s ease-in-out infinite}
.team-row .slot.full.lunge .ava{animation:miniLunge .42s ease-out}
@keyframes idlebob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes struck{0%,100%{filter:none}30%{filter:brightness(2.4) saturate(.4)}}
@keyframes die{to{opacity:.3;transform:translateY(10px) rotate(-12deg) scale(.85)}}
@keyframes slashfx{0%{opacity:0;transform:scale(.4) rotate(-25deg)}40%{opacity:1}100%{opacity:0;transform:scale(1.6) rotate(18deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes miniLunge{0%,100%{transform:none}50%{transform:translateY(-7px) scale(1.12)}}
.unit.cheer{animation:cheer .6s ease-in-out 2}
@keyframes cheer{0%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}60%{transform:translateY(-3px)}}
.proj{position:fixed;width:14px;height:14px;border-radius:50%;z-index:6;pointer-events:none;background:currentColor;box-shadow:0 0 14px currentColor,0 0 4px #fff}
.unit.boss .face{width:92px;height:92px;font-size:30px;box-shadow:0 0 0 2px var(--gold),0 0 24px #b061ff}
.unit.boss .nm{color:#d6a8ff}
.dummy{display:flex;align-items:center;gap:11px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.dummyface{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:22px;background:linear-gradient(160deg,#54607a,#0008);flex:0 0 auto;transition:transform .12s}
.dummyface.hit{transform:translateX(-6px)}
.dummywrap{flex:1}
.dummylab{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.dummybar{height:10px;border-radius:6px;background:#1c2336;overflow:hidden;border:1px solid #ffffff14}
.xpbar{height:7px;border-radius:5px;background:#1c2336;overflow:hidden;border:1px solid #ffffff12}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#b69bff,#5bd1ff);border-radius:5px}
.hero .focus{position:absolute;top:6px;left:6px;font-size:11px;font-weight:800;font-family:Orbitron;color:#04222a;background:#36e0e6;padding:1px 6px;border-radius:8px}
.dummybar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--bad),#ffb0b8);transition:width .3s}
.overlay{position:fixed;inset:0;display:none;place-items:center;z-index:90;background:#050811d8;backdrop-filter:blur(4px);padding:24px}
.overlay.show{display:grid;animation:fade .3s}
.obox{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:20px;padding:26px 22px;text-align:center;max-width:340px;animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
.obox .ico{font-size:40px}
.obox h2{font-size:19px;margin:8px 0 2px}
.obox .big{font-family:'Orbitron';font-weight:900;font-size:34px;color:var(--gold);margin:10px 0}
.obox p{color:var(--muted);font-weight:600;font-size:14px;margin:0;line-height:1.4}
.obox button{margin-top:16px;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px 30px;font-family:'Orbitron';font-weight:700;width:100%}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.sprcanvas{width:100%;height:100%;display:block}
.sprbtn{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:11px;font-weight:700;font-size:14px;margin-bottom:10px}
.sprgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:12px}
.sprgrid .f{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.sprgrid .f label{font-size:9px;letter-spacing:.5px;margin:0 0 2px}
.sprgrid .f input{width:100%;background:none;border:none;color:var(--ink);font-family:'Orbitron';font-weight:700;font-size:15px;padding:0;margin:0}
.sprprev{display:flex;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.sprprev canvas{width:92px;height:92px;flex:0 0 auto;background:#0a0d15;border-radius:10px;border:1px solid var(--line)}
.sprprev .pv{flex:1}
.sprprev .pv .pb{display:flex;gap:7px;margin-top:8px}
.sprprev .pv .pb button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 4px;font-weight:700;font-size:13px}
.gslot{display:flex;align-items:center;gap:11px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px}
.gslot .gi{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:20px;flex:0 0 auto;background:var(--panel2);border:1px solid var(--line)}
.gslot .gb{flex:1;min-width:0}
.gslot .gname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gslot .gsub{font-size:12px;color:var(--muted);font-weight:600;margin-top:1px}
.gslot .gup{background:var(--accent2);color:#fff;border:none;border-radius:9px;padding:8px 11px;font-weight:700;font-size:13px;flex:0 0 auto;font-family:'Rajdhani'}

.ginv{display:flex;align-items:center;gap:11px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}
.ginv .pick{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 13px;font-weight:700;font-size:13px;flex:0 0 auto}
.gscore{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 7px;font-size:11px;font-weight:800;font-family:'Orbitron'}

function rankIdx(h){ return h.rank||0; }

function canRankUp(h){ const i=rankIdx(h); if(i>=RANKUP.length) return false; const r=RANKUP[i];
  return (S.heroCores||0)>=(r.cores||0) && (S.gold||0)>=(r.gold||0) && (S.bossCores||0)>=(r.boss||0) && (S.sparks||0)>=(r.sparks||0); }
function rankReqText(r){ const p=[]; if(r.cores)p.push(r.cores+' ◈'); if(r.gold)p.push(r.gold+' ⦿'); if(r.boss)p.push(r.boss+' ◆'); if(r.sparks)p.push(r.sparks+' ✦✦'); return p.join(' · '); }
function prestigeMult(h){ return 1+(h.prestige||0)*0.10; }
function prestigeExpMult(h){ return 1+(h.prestige||0)*0.02; }
function prestigeCost(h){ const p=h.prestige||0; return {sparks:1+p, gold:1000+p*1500}; }
function prestigeReqs(h){ const g=h.gear||{};
  return [
    {ok:rankIdx(h)>=RANKS.length-1, label:'Eternal rank'},
    {ok:h.level>=rankCap(h), label:'Max level ('+rankCap(h)+')'},
    {ok:SLOTS.every(s=>g[s]), label:'All 4 gear slots filled'},
    {ok:SLOTS.some(s=>g[s]&&RARITY.indexOf(g[s].rarity)>=4), label:'A Mythic+ gear piece equipped'}
  ]; }
function prestigeEligible(h){ return prestigeReqs(h).every(r=>r.ok); }
function canPrestige(h){ const c=prestigeCost(h); return prestigeEligible(h) && (S.sparks||0)>=c.sparks && (S.gold||0)>=c.gold; }
/* projected power at a hypothetical level/prestige, without mutating the hero */
function projectedPower(h,level,prestige){ const b=TUNE.roleBase[h.role], sc=TUNE.heroScale(level), g=heroGearStats(h), rm=rankMult(h), pm=1+0.10*prestige;
  const hp=Math.round((b.hp*sc+g.hp)*rm*pm), atk=Math.round((b.atk*sc+g.atk)*rm*pm); return Math.round(hp/8+atk*2); }
/* ===== per-hero auto-leveling ===== */
const TASKEXP={easy:10,med:25,hard:50};
function applyLevels(h){ let c; while(h.level<rankCap(h) && (h.exp||0)>=(c=TUNE.levelCost(h.level))){ h.exp-=c; h.level++; } }
function catchUpPct(lvl,hi){ if(lvl>=hi) return 0; const r=lvl/hi; if(r<0.5) return 0.5; if(r<0.8) return 0.25; return 0.1; }
function gainExp(amount){ if(!S.heroes.length || !(amount>0)) return;
  amount*=collXpMult();
  const owned=S.heroes.filter(h=>h.owned); if(!owned.length) return;
  const hi=Math.max(1,...owned.map(h=>h.level));
  const active=activeIds();
  owned.forEach(h=>{ let share = active.has(h.id) ? amount : amount*catchUpPct(h.level,hi);
    if(S.focus===h.id) share += amount;
    share *= prestigeExpMult(h);
    if(share>0){ h.exp=(h.exp||0)+share; applyLevels(h); } });
  recalcCollection(); }
/* ===== collection power / level ===== */
let gCP=0, gCL=0;
function heroCP(h){ if(!h.owned) return 0; let cp=10;
  if(h.level>=25)cp+=5; if(h.level>=50)cp+=10; if(h.level>=75)cp+=15; if(h.level>=100)cp+=25;
  cp+=rankIdx(h)*6; cp+=(h.prestige||0)*50; return cp; }
function collectionPowerTotal(){ let t=0; S.heroes.forEach(h=>{ t+=heroCP(h); }); return t; }
function clFromCP(cp){ return Math.floor((-1+Math.sqrt(1+0.4*cp))/2); }
function cpForLevel(L){ return 10*L*(L+1); }
function recalcCollection(){ gCP=collectionPowerTotal(); gCL=clFromCP(gCP); }
function collectionMult(){ return 1+0.01*gCL; }
function ownedCount(){ return S.heroes.reduce((n,h)=>n+(h.owned?1:0),0); }
function collGoldMult(){ return 1+0.01*Math.floor(gCL/5); }
function collXpMult(){ return 1+0.01*Math.floor(gCL/10); }
function seedRoster(){ const have=new Set(S.heroes.map(h=>h.id));
  ROSTER.forEach(r=>{ if(!have.has(r.id)) S.heroes.push({id:r.id,name:r.name,ip:r.ip,role:r.role,color:r.color,img:null,level:1,rank:0,prestige:0,exp:0,gear:{weapon:null,armor:null,boots:null,relic:null},owned:!!r.owned}); }); }
function lockedHeroes(){ return S.heroes.filter(h=>!h.owned); }
const UNLOCK_RANDOM=100, UNLOCK_TARGET=250, CRYSTALS={easy:3,med:6,hard:10};
function doUnlock(h){ h.owned=true; S.wishlist=(S.wishlist||[]).filter(x=>x!==h.id); recalcCollection(); }
function randomUnlock(){ if(S.crystals<UNLOCK_RANDOM){toast('Need '+UNLOCK_RANDOM+' ◆ crystals');return null;} const pool=lockedHeroes(); if(!pool.length){toast('Every hero unlocked! 🎉');return null;}
  const wish=pool.filter(h=>S.wishlist.includes(h.id)); const src=(wish.length&&Math.random()<0.5)?wish:pool; const h=src[Math.floor(Math.random()*src.length)];
  S.crystals-=UNLOCK_RANDOM; doUnlock(h); save(); return h; }
function targetedUnlock(id){ const h=S.heroes.find(x=>x.id===id); if(!h||h.owned) return false; if(S.crystals<UNLOCK_TARGET){toast('Need '+UNLOCK_TARGET+' ◆ crystals');return false;} S.crystals-=UNLOCK_TARGET; doUnlock(h); save(); return true; }
function toggleWish(id){ if(S.wishlist.includes(id)) S.wishlist=S.wishlist.filter(x=>x!==id); else S.wishlist.push(id); save(); }
function gearPower(g){ return Math.round(10*RARMULT[g.rarity]+g.level*5); }
function gearMaxLvl(g){ return RARMAX[g.rarity]; }
function gearCostOf(g){ const m=RARMULT[g.rarity]; return {gold:Math.round(25*m*(g.level+1)), dust:Math.round(10*m*(g.level+1))}; }
function gearName(g){ const t={weapon:'Blade',armor:'Plate',boots:'Greaves',relic:'Relic'}; return cap(g.rarity)+' '+t[g.slot]; }
function newGear(slot,rarity){ return {id:uid(),slot,rarity:rarity||'common',level:0}; }
function rollRarity(stage){ const s=stage||1, r=Math.random();
  const legc=Math.min(0.03+s*0.004,0.22), epc=legc+Math.min(0.12+s*0.006,0.4), rrc=epc+0.3;
  if(r<legc) return s>=30?'mythic':'legendary';
  if(r<epc) return 'epic';
  if(r<rrc) return 'rare';
  return 'common'; }
function gearStat(g){ const p=gearPower(g);
  if(g.slot==='weapon') return {atk:p,hp:0};
  if(g.slot==='armor') return {atk:0,hp:Math.round(p*8)};
  if(g.slot==='boots') return {atk:Math.round(p*0.4),hp:Math.round(p*4)};
  return {atk:Math.round(p*0.5),hp:Math.round(p*4)}; }
function heroGearStats(h){ let atk=0,hp=0; if(h.gear) SLOTS.forEach(s=>{const g=h.gear[s]; if(g){const v=gearStat(g);atk+=v.atk;hp+=v.hp;}}); return {atk,hp}; }
function gearScore(h){ let p=0; if(h.gear) SLOTS.forEach(s=>{ if(h.gear[s]) p+=gearPower(h.gear[s]); }); return p; }
function grantGear(g){ S.inventory.push(g); }
const PROMO={common:{to:'rare',dust:100,stones:1,gold:200},rare:{to:'epic',dust:250,stones:2,gold:500},epic:{to:'legendary',dust:500,stones:4,gold:1200},legendary:{to:'mythic',dust:1000,stones:6,gold:3000},mythic:{to:'eternal',dust:2500,stones:10,gold:8000}};
function promoCost(g){ return PROMO[g.rarity]||null; }
function canPromote(g){ const p=PROMO[g.rarity]; return !!p && g.level>=gearMaxLvl(g) && (S.dust||0)>=p.dust && (S.stones||0)>=p.stones && (S.gold||0)>=p.gold; }
function salvageValue(g){ return ({common:10,rare:30,epic:100,legendary:300,mythic:750,eternal:2000})[g.rarity]||10; }
function taskLoot(diff){ const r=TASKREWARD[diff]||TASKREWARD.med; S.gold+=r.g; S.dust+=r.d; S.heroCores+=(r.cores||0); const cr=CRYSTALS[diff]||CRYSTALS.med; S.crystals+=cr;
  let s=' · +'+cr+'◆ +'+r.g+'⦿ +'+r.d+'❖'+(r.cores?' +'+r.cores+'◈':'');
  if(Math.random()<r.drop){ const g=newGear(SLOTS[Math.floor(Math.random()*4)],rollRarity(S.maxCleared||1)); grantGear(g); s+=' · '+cap(g.rarity)+' gear dropped!'; }
  const raid=dealRaid(diff); s+=' · ⚔'+raid.rd+' raid'; if(raid.msgs.length) s+=' · '+raid.msgs.join(' · ');
  gainExp(TASKEXP[diff]||TASKEXP.med);

function periodKey(freq,d){ d=d||new Date();
  if(freq==='weekly'){ const x=new Date(d); const dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); return 'W'+x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate(); }
  if(freq==='monthly'){ return 'M'+d.getFullYear()+'-'+(d.getMonth()+1); }
  return 'D'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();

function prevPeriodDate(freq,d){ const x=new Date(d||new Date());

/* ===== economy ===== */
function expRate(){ return TUNE.expPerHour*(1+TUNE.stageRateBonus*S.maxCleared); }
function accrueOffline(){
  const now=Date.now();
  const elapsedH=(now-(S.lastSeen||now))/3600000;
  const used=Math.min(elapsedH, S.charge);
  if(used>0){ const gained=used*expRate(); gainExp(gained); S.charge=+(S.charge-used).toFixed(3);
    if(elapsedH>0.0167 && gained>=1) awayReport={exp:Math.round(gained),hours:used}; }
  S.lastSeen=now;
}
function rollover(){
  const now=new Date();
  S.dailies.forEach(d=>{ const cur=periodKey(d.freq,now);
    if(d.pk!==cur){ const prev=periodKey(d.freq,prevPeriodDate(d.freq,now));
      if(!(d.done && d.pk===prev)) d.streak=0; d.done=false; d.pk=cur; } });
  S.habits.forEach(h=>{ const cur=periodKey(h.freq,now); if(h.pk!==cur){ h.count=0; h.pk=cur; } });
}
function bankCharge(diff){ S.charge=+(S.charge+TUNE.chargeByDiff[diff]).toFixed(3); }

/* hero stats */
function hpOf(h){ return Math.round((TUNE.roleBase[h.role].hp*TUNE.heroScale(h.level)+heroGearStats(h).hp)*rankMult(h)*prestigeMult(h)*collectionMult()); }
function atkOf(h){ return Math.round((TUNE.roleBase[h.role].atk*TUNE.heroScale(h.level)+heroGearStats(h).atk)*rankMult(h)*prestigeMult(h)*collectionMult()); }
function powerOf(h){ return Math.round(hpOf(h)/8+atkOf(h)*2); }

function squad(mode){ if(!S.squads) S.squads={campaign:[],tower:[],raid:[]}; if(!Array.isArray(S.squads[mode])) S.squads[mode]=[]; return S.squads[mode]; }
function inSquad(mode,id){ return squad(mode).includes(id); }
function inAnySquad(id){ return SQUADS.some(s=>inSquad(s[0],id)); }
function squadIcons(id){ return SQUADS.filter(s=>inSquad(s[0],id)).map(s=>s[2]).join(''); }
function activeIds(){ const set=new Set(); SQUADS.forEach(s=>squad(s[0]).forEach(id=>set.add(id))); return set; }
function teamPower(mode){ return squad(mode).reduce((s,id)=>{const h=S.heroes.find(x=>x.id===id);return s+(h?powerOf(h):0);},0); }
function toggleSquad(mode,id){ const arr=squad(mode), i=arr.indexOf(id); if(i>=0){arr.splice(i,1);return true;} if(arr.length>=TUNE.teamSize){toast(SQUADS.find(s=>s[0]===mode)[1]+' squad is full ('+TUNE.teamSize+')');return false;} arr.push(id); return true; }

function onTaskClick(e){

    if(!d.done){ d.done=true; d.streak++; const bn=Math.min(TUNE.streakBonusCap,Math.floor(d.streak/TUNE.streakBonusPer)); S.charge=+(S.charge+base+bn).toFixed(3);
      let msg='+'+(base+bn)+'h charge ⚡'+(bn?' (+'+bn+' streak)':''); const pk=periodKey(d.freq);
      if(d.lootedPk!==pk){ msg+=taskLoot(d.diff); d.lootedPk=pk; if(d.freq==='daily'){ ensureWeek().done++; const cm=checkChests(); if(cm.length) msg+=' · '+cm.join(' · '); } }
      flash(el); toast(msg); }
    else { const bn=Math.min(TUNE.streakBonusCap,Math.floor(d.streak/TUNE.streakBonusPer)); d.done=false; d.streak=Math.max(0,d.streak-1); S.charge=Math.max(0,S.charge-base-bn); } }
  else if(act==='hplus'){ const h=f(S.habits); h.count++; const pk=periodKey(h.freq);
    if(h.chgPk!==pk){ h.chgPk=pk; h.chg=0; }
    if(h.chg<TUNE.habitChargeCap){ h.chg++; bankCharge(h.diff); flash(el); toast('+'+TUNE.chargeByDiff[h.diff]+'h charge ⚡'+(h.chg>=TUNE.habitChargeCap?' · charge maxed today':'')); }

  else if(act==='hminus'){ const h=f(S.habits); h.count--; flash(el); toast('Logged a slip'); }
  else if(act==='todo'){ const t=f(S.todos); if(!t.done){ t.done=true; let msg='+'+TUNE.chargeByDiff[t.diff]+'h charge ⚡'; bankCharge(t.diff); if(!t.looted){ msg+=taskLoot(t.diff); t.looted=true; } flash(el); toast(msg); } else t.done=false; }

function buildEnemies(stage){
  const g=Math.pow(TUNE.enemyGrowth,stage-1);
  if(stage%TUNE.bossEvery===0){
    const hp=Math.round(TUNE.enemyHpBase*g*TUNE.bossHpMult), atk=Math.round(TUNE.enemyAtkBase*g*TUNE.bossAtkMult);
    return [{name:'BOSS · Stage '+stage,img:null,color:'#b061ff',hp,max:hp,atk,side:'e',dead:false,boss:true}];
  }
  const cnt=TUNE.enemyCount(stage), arr=[];
  for(let i=0;i<cnt;i++){ const hp=Math.round(TUNE.enemyHpBase*g);
    arr.push({name:'Stage '+stage+'-'+(i+1),img:null,color:'#54607a',hp,max:hp,atk:Math.round(TUNE.enemyAtkBase*g),side:'e',dead:false}); }
  return arr;
}
function stageEnemyPower(s){ return buildEnemies(s).reduce((p,u)=>p+Math.round(u.max/8+u.atk*2),0); }
function buildTowerEnemies(f){
  const g=Math.pow(TUNE.towerGrowth,f-1);
  if(f%TUNE.towerMajorEvery===0){ const hp=Math.round(TUNE.towerHpBase*g*TUNE.towerMajorHpMult), atk=Math.round(TUNE.towerAtkBase*g*TUNE.towerMajorAtkMult); return [{name:'MAJOR BOSS · Floor '+f,img:null,color:'#ff4d6d',hp,max:hp,atk,side:'e',dead:false,boss:true}]; }
  if(f%TUNE.towerMiniEvery===0){ const hp=Math.round(TUNE.towerHpBase*g*TUNE.towerMiniHpMult), atk=Math.round(TUNE.towerAtkBase*g*TUNE.towerMiniAtkMult); return [{name:'MINI-BOSS · Floor '+f,img:null,color:'#c44dff',hp,max:hp,atk,side:'e',dead:false,boss:true}]; }
  const cnt=f>=5?4:3, arr=[];
  for(let i=0;i<cnt;i++){ const hp=Math.round(TUNE.towerHpBase*g); arr.push({name:'Floor '+f+'-'+(i+1),img:null,color:'#6a4a7a',hp,max:hp,atk:Math.round(TUNE.towerAtkBase*g),side:'e',dead:false}); }
  return arr;
}
function towerEnemyPower(f){ return buildTowerEnemies(f).reduce((p,u)=>p+Math.round(u.max/8+u.atk*2),0); }

/* ===== WEEKLY RAID ===== */
const RAIDNAMES=['Inertia','The Backslide','Old Patterns','The Drift','The Slump','Resistance','The Comfort Zone','Autopilot'];
function raidBase(diff){ return ({easy:10,med:25,hard:60})[diff]||25; }
function newRaidBoss(){ const tp=teamPower('raid'); return {wk:periodKey('weekly'), max:Math.max(3000,Math.round(4000*(1+(S.maxCleared||0)*0.08)*(1+tp/1500))), dmg:0, claimed:{}, over:0}; }
function ensureRaid(){ if(!S.raid || S.raid.wk!==periodKey('weekly')) S.raid=newRaidBoss(); return S.raid; }
function weekHash(){ const s=ensureRaid().wk; let h=0; for(let i=0;i<s.length;i++) h=(h+s.charCodeAt(i))|0; return Math.abs(h); }
function weekEndsIn(){ const now=new Date(), x=new Date(now); const dow=(x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-dow+7); const ms=x-now; return Math.floor(ms/86400000)+'d '+Math.floor((ms%86400000)/3600000)+'h'; }
function raidTierLabel(t){ return ({25:'Gold + EXP + Dust',50:'Hero Cores + Dust',75:'Promotion Stone + gear',100:'Prestige Spark + rare gear'})[t]; }
function grantRaidTier(t){
  if(t===25){ const g=40+(S.maxCleared||0)*3; S.gold+=g; gainExp(100); S.dust+=30; return 'Raid 25% +'+g+'⦿'; }
  if(t===50){ const c=5+Math.floor((S.maxCleared||0)/4); S.heroCores+=c; S.dust+=60; return 'Raid 50% +'+c+'◈'; }
  if(t===75){ S.stones+=1; grantGear(newGear(SLOTS[Math.floor(Math.random()*4)], rollRarity((S.maxCleared||1)+12))); return 'Raid 75% +1◇ +gear'; }
  if(t===100){ S.sparks+=1; grantGear(newGear(SLOTS[Math.floor(Math.random()*4)], rollRarity((S.maxCleared||1)+24))); return 'Raid 100%! +1✦✦ +gear'; }
  return '';
}
function grantRaidOverkill(){ const c=3+Math.floor((S.maxCleared||0)/5); S.heroCores+=c; S.gold+=60; let s='Overkill +'+c+'◈'; if(Math.random()<0.3){S.stones+=1;s+=' +1◇';} if(Math.random()<0.15){S.sparks+=1;s+=' +1✦✦';} return s; }
function checkRaidThresholds(){ const R=ensureRaid(), msgs=[]; const pct=R.dmg/R.max*100;
  [25,50,75,100].forEach(t=>{ if(pct>=t && !R.claimed[t]){ R.claimed[t]=true; msgs.push(grantRaidTier(t)); } });
  while(R.dmg>=R.max*(1+((R.over||0)+1)*0.25)){ R.over=(R.over||0)+1; msgs.push(grantRaidOverkill()); }
  return msgs; }
function dealRaid(diff){ const R=ensureRaid(); const rd=Math.round(raidBase(diff)*(1+teamPower('raid')/1000)); R.dmg+=rd; const msgs=checkRaidThresholds(); return {rd,msgs}; }

/* ===== WEEKLY CHEST (consistency) ===== */
const CHESTS=[{p:25,name:'Small'},{p:50,name:'Medium'},{p:75,name:'Large'},{p:90,name:'Epic'},{p:100,name:'Legendary'}];
function weekPossible(){ return Math.max(1,(S.dailies||[]).filter(d=>d.freq==='daily').length*7); }
function ensureWeek(){ if(!S.week || S.week.wk!==periodKey('weekly')) S.week={wk:periodKey('weekly'),done:0,claimed:{}}; return S.week; }
function grantChest(c){ const m=S.maxCleared||0, rs=()=>SLOTS[Math.floor(Math.random()*4)];
  if(c.p===25){ const g=60+m*3; S.gold+=g; gainExp(150); S.dust+=40; S.crystals+=10; return 'Small Chest +10◆ +'+g+'⦿ +40❖'; }
  if(c.p===50){ const g=120+m*4, hc=6+Math.floor(m/4); S.gold+=g; gainExp(250); S.dust+=80; S.heroCores+=hc; S.crystals+=20; return 'Medium Chest +20◆ +'+g+'⦿ +'+hc+'◈'; }
  if(c.p===75){ const hc=10+Math.floor(m/3); S.heroCores+=hc; S.crystals+=30; grantGear(newGear(rs(),rollRarity(m+12))); let s='Large Chest +30◆ +'+hc+'◈ +gear'; if(Math.random()<0.5){S.bossCores+=1;s+=' +1◆';} return s; }
  if(c.p===90){ S.bossCores+=1; S.crystals+=50; grantGear(newGear(rs(),'epic')); let s='Epic Chest +50◆ +Epic gear'; if(Math.random()<0.5){S.stones+=1;s+=' +1◇';} if(Math.random()<0.4){S.sparks+=1;s+=' +1✦✦';} return s; }
  if(c.p===100){ S.sparks+=1; S.stones+=1; S.crystals+=80; grantGear(newGear(rs(),'legendary')); return 'Legendary Chest +80◆ +1✦✦ +1◇ +Legendary gear'; }
  return ''; }
function checkChests(){ const W=ensureWeek(), pct=W.done/weekPossible()*100, msgs=[];
  CHESTS.forEach(c=>{ if(pct>=c.p && !W.claimed[c.p]){ W.claimed[c.p]=true; msgs.push(grantChest(c)); } });
  return msgs; }

/* ===== BATTLE ENGINE ===== */
let battleTimer=null, autoNext=null, battleMode='campaign';
function startBattle(mode){
  clearAuto();
  battleMode = (mode==='tower')?'tower':'campaign';
  const sq=squad(battleMode);
  if(!sq.length){ toast('Assign a '+battleMode+' squad first'); return; }
  const players=sq.map(id=>{const h=S.heroes.find(x=>x.id===id);return{name:h.name,img:h.img,color:h.color,role:h.role,hp:hpOf(h),max:hpOf(h),atk:atkOf(h),side:'p',dead:false};});
  let enemies, head;
  if(battleMode==='tower'){ const f=S.tower; enemies=buildTowerEnemies(f);
    head=(f%TUNE.towerMajorEvery===0?'MAJOR BOSS — FLOOR ':f%TUNE.towerMiniEvery===0?'MINI-BOSS — FLOOR ':'TOWER — FLOOR ')+f; }
  else { enemies=buildEnemies(S.stage);
    head=(S.stage%TUNE.bossEvery===0?'BOSS — STAGE ':'STAGE ')+S.stage; }
  document.getElementById('arenaHead').textContent=head;
  document.getElementById('arenaResult').style.display='none';
  drawUnits('enemySide',enemies,'enemy'); drawUnits('playerSide',players,'player');
  document.getElementById('arena').classList.add('show');

  let turn=0;
  battleTimer=setInterval(()=>{
    turn++;
    players.filter(u=>!u.dead).forEach(u=>{ const t=pickTarget(enemies); if(t) strike(u,t,'enemy'); });
    enemies.filter(u=>!u.dead).forEach(u=>{ const t=pickTarget(players); if(t) strike(u,t,'player'); });
    refreshBars('enemySide',enemies); refreshBars('playerSide',players);
    const pAlive=players.some(u=>!u.dead), eAlive=enemies.some(u=>!u.dead);
    if(!eAlive||!pAlive||turn>40){ clearInterval(battleTimer); battleTimer=null; setTimeout(()=>endBattle(!eAlive&&pAlive),450); }
  },720);
}
function pickTarget(arr){ const a=arr.filter(u=>!u.dead); return a.length?a[Math.floor(Math.random()*a.length)]:null; }
function strike(att,tgt,sideClass){
  const dmg=Math.max(1,Math.round(att.atk*(0.9+Math.random()*0.2)));
  const died = tgt.hp>0 && (tgt.hp-dmg)<=0;
  tgt.hp-=dmg; if(tgt.hp<=0){tgt.hp=0;tgt.dead=true;}
  const ranged = att.side==='p' && (att.role==='DPS'||att.role==='Support');
  const col = att.side==='p' ? (ROLECOLOR[att.role]||'#fff') : '#ff9f43';
  const aEl=document.querySelector('#'+(att.side==='p'?'playerSide':'enemySide')+' [data-idx="'+att._i+'"]');
  if(aEl){ aEl.classList.add('lunge'); setTimeout(()=>aEl.classList.remove('lunge'),180); }
  const el=document.querySelector('#'+(sideClass==='enemy'?'enemySide':'playerSide')+' [data-idx="'+tgt._i+'"]');
  if(el){ el.classList.add('hit','struck'); setTimeout(()=>el.classList.remove('hit','struck'),320); floatDmg(el,dmg);
    if(ranged && aEl) projectile(aEl,el,col);
    spawnFx(el,col);
    if(died){ el.classList.add('dying'); shakeArena(); } }
}
function projectile(aEl,tEl,color){
  const a=aEl.getBoundingClientRect(), t=tEl.getBoundingClientRect();
  const p=document.createElement('div'); p.className='proj'; p.style.color=color;
  p.style.left=(a.left+a.width/2-7)+'px'; p.style.top=(a.top+a.height/2-7)+'px';
  p.style.transition='transform .2s linear'; document.body.appendChild(p);
  const dx=(t.left+t.width/2)-(a.left+a.width/2), dy=(t.top+t.height/2)-(a.top+a.height/2);
  requestAnimationFrame(()=>{ p.style.transform='translate('+dx+'px,'+dy+'px)'; });
  setTimeout(()=>p.remove(),240);
}
function spawnFx(el,color){
  const f=el.querySelector('.face'); if(!f) return;
  const fx=document.createElement('div'); fx.className='fx slash';
  if(color) fx.style.boxShadow='0 0 0 3px '+color+' inset, 0 0 18px '+color;
  f.appendChild(fx); setTimeout(()=>fx.remove(),360);
}
function shakeArena(){ const a=document.getElementById('arena'); a.classList.add('shake'); setTimeout(()=>a.classList.remove('shake'),260); }
function floatDmg(el,n){
  const r=el.getBoundingClientRect(); const d=document.createElement('div');
  d.className='dmg'; d.textContent='-'+n; d.style.left=(r.left+r.width/2-12)+'px'; d.style.top=(r.top+8)+'px';
  document.body.appendChild(d); setTimeout(()=>d.remove(),800);
}
function drawUnits(containerId,arr,cls){
  const c=document.getElementById(containerId); c.innerHTML='';
  arr.forEach((u,i)=>{ u._i=i;
    const face=u.img?'<img src="'+u.img+'">':initials(u.name);
    const el=document.createElement('div'); el.className='unit '+cls+(u.boss?' boss':''); el.dataset.idx=i;
    el.innerHTML='<div class="face" style="background:linear-gradient(160deg,'+u.color+',#0008)">'+face+'</div>'+
      '<div class="info"><div class="nm">'+esc(u.name)+'</div><div class="hpbar"><i style="width:100%"></i></div></div>';
    c.appendChild(el);
  });
}
function refreshBars(containerId,arr){
  arr.forEach((u,i)=>{ const el=document.querySelector('#'+containerId+' [data-idx="'+i+'"]'); if(!el)return;
    el.querySelector('.hpbar i').style.width=Math.max(0,u.hp/u.max*100)+'%';
    el.classList.toggle('dead',u.dead);
  });
}
function clearAuto(){ if(autoNext){clearInterval(autoNext);autoNext=null;} }
function closeArena(){ clearAuto(); document.getElementById('arena').classList.remove('show'); renderHUD(); render(); save(); }
function nextBattle(){ clearAuto(); startBattle(battleMode); }
function victoryFooter(label){
  return '<div style="font-weight:700;color:var(--muted);margin:8px 0 2px">'+label+' in <span id="cdn">3</span>s</div>'+
    '<div style="display:flex;gap:8px;margin-top:10px"><button id="arenaNext" style="flex:1">Continue ▶</button><button id="arenaStop" style="flex:1;background:var(--panel2);color:var(--ink);border:1px solid var(--line)">Stop</button></div>';
}
function wireAuto(){ let n=3; const cd=document.getElementById('cdn');
  autoNext=setInterval(()=>{ n--; if(cd)cd.textContent=n; if(n<=0) nextBattle(); },1000);
  document.getElementById('arenaNext').onclick=nextBattle;
  document.getElementById('arenaStop').onclick=closeArena;
}
function endBattle(win){
  clearAuto();
  const r=document.getElementById('arenaResult'); r.style.display='block'; r.className='result '+(win?'win':'lose');
  if(win && battleMode==='tower'){
    const f=S.tower, mini=f%TUNE.towerMiniEvery===0, major=f%TUNE.towerMajorEvery===0;
    let cores=1+Math.floor(f/8), gold=10+f*3, dust=6+f*2, txt='';
    if(major){ cores+=20; S.sparks+=1; const g=newGear(SLOTS[Math.floor(Math.random()*4)], rollRarity(f+30)); grantGear(g); txt='<br>★ MAJOR BOSS — +1 ✦✦ Spark · '+cap(g.rarity)+' '+SLOTNAME[g.slot]+' · +20 ◈ bundle'; }
    else if(mini){ S.bossCores+=1; const g=newGear(SLOTS[Math.floor(Math.random()*4)], rollRarity(f+10)); grantGear(g); txt='<br>MINI-BOSS — +1 ◆ Boss Core · '+cap(g.rarity)+' '+SLOTNAME[g.slot]; if(Math.random()<0.4){ S.stones+=1; txt+=' · +1 ◇ Stone'; } }
    S.heroCores+=cores; S.gold+=gold; S.dust+=dust; S.tower=f+1;
    document.querySelectorAll('#playerSide .unit:not(.dead)').forEach(u=>u.classList.add('cheer'));
    r.innerHTML='<h2>FLOOR '+f+' CLEAR</h2><p>+'+cores+' ◈ · +'+gold+' ⦿ · +'+dust+' ❖'+txt+'</p>'+victoryFooter('Auto-climbing');
    wireAuto(); save(); return;
  }
  if(win){
    const boss=S.stage%TUNE.bossEvery===0;
    const reward=(20+S.stage*10)*(boss?TUNE.bossRewardMult:1);
    const gold=(8+S.stage*2)*(boss?3:1), dust=(4+S.stage)*(boss?3:1);
    gainExp(reward); S.gold+=gold; S.dust+=dust;
    let drop='';
    if(boss || Math.random()<0.15){ const g=newGear(SLOTS[Math.floor(Math.random()*4)], rollRarity(S.stage + (boss?6:0))); grantGear(g); drop='<br>Loot: '+cap(g.rarity)+' '+SLOTNAME[g.slot]; }
    if(boss){ S.bossCores+=1; drop+=' · +1 ◆ Boss Core'; if(Math.random()<0.08){ S.sparks+=1; drop+=' · +1 ✦✦ Spark!'; } }
    if(S.stage>S.maxCleared) S.maxCleared=S.stage;
    S.stage++;
    document.querySelectorAll('#playerSide .unit:not(.dead)').forEach(u=>u.classList.add('cheer'));
    r.innerHTML='<h2>VICTORY</h2><p>+'+reward+' EXP · +'+gold+'⦿ · +'+dust+'❖'+drop+'</p>'+victoryFooter('Auto-advancing');
    wireAuto();
  } else {
    r.innerHTML='<h2>'+(battleMode==='tower'?'FLOOR HELD':'DEFEATED')+'</h2><p>'+(battleMode==='tower'?'This floor turned you back.<br>Strengthen your team and climb again.':'Your team got overwhelmed.<br>Do habits, level your heroes, then try again.')+'</p><button id="arenaStop">Back</button>';
    document.getElementById('arenaStop').onclick=closeArena;
  }
  save();
}

/* ===== task sheet ===== */
function openTaskSheet(id){
  const item=id?S[subtab].find(x=>x.id===id):null;
  let diff=item?item.diff:'med';
  let dir=item?(item.up&&item.down?'both':item.down?'down':'up'):'up';
  let freq=item&&item.freq?item.freq:'daily';
  const kind=subtab==='dailies'?'Daily':subtab==='habits'?'Habit':'Quest';
  const s=document.getElementById('sheet');
  let h='<h3>'+(id?'Edit ':'New ')+kind+'</h3><label>Title</label><input type="text" id="f_title" maxlength="60" value="'+(item?esc(item.title):'')+'">';
  h+='<label>Difficulty</label><div class="segs" id="f_diff">'+['easy','med','hard'].map(d=>'<button data-d="'+d+'" class="'+(d===diff?'on':'')+'">'+d+'</button>').join('')+'</div>';
  if(subtab!=='todos') h+='<label>Repeats</label><div class="segs" id="f_freq">'+FREQS.map(fq=>'<button data-fq="'+fq+'" class="'+(fq===freq?'on':'')+'">'+cap(fq)+'</button>').join('')+'</div>';
  if(subtab==='habits') h+='<label>Track</label><div class="segs" id="f_dir"><button data-x="up" class="'+(dir==='up'?'on':'')+'">Good +</button><button data-x="down" class="'+(dir==='down'?'on':'')+'">Bad −</button><button data-x="both" class="'+(dir==='both'?'on':'')+'">Both</button></div>';
  h+='<button class="go" id="f_save">'+(id?'Save':'Add')+'</button>'+(id?'<button class="ghost" id="f_del">Delete</button>':'');
  s.innerHTML=h; showScrim('scrim');
  segPick('f_diff',d=>diff=d); if(subtab!=='todos') segPick('f_freq',f=>freq=f,'fq'); if(subtab==='habits') segPick('f_dir',d=>dir=d,'x');
  document.getElementById('f_save').onclick=()=>{
    const title=document.getElementById('f_title').value.trim(); if(!title)return;
    if(subtab==='dailies'){ if(item){item.title=title;item.diff=diff; if(item.freq!==freq){item.freq=freq;item.pk=periodKey(freq);item.done=false;}} else S.dailies.push({id:uid(),title,diff,freq,streak:0,done:false,pk:periodKey(freq)}); }
    else if(subtab==='habits'){ const up=dir!=='down',down=dir!=='up'; if(item){item.title=title;item.diff=diff;item.up=up;item.down=down; if(item.freq!==freq){item.freq=freq;item.pk=periodKey(freq);item.count=0;}} else S.habits.push({id:uid(),title,diff,freq,up,down,count:0,pk:periodKey(freq)}); }
    else { if(item){item.title=title;item.diff=diff;} else S.todos.push({id:uid(),title,diff,done:false}); }
    hideScrim(); render(); save();
  };
  const del=document.getElementById('f_del'); if(del) del.onclick=()=>{ S[subtab]=S[subtab].filter(x=>x.id!==id); hideScrim(); render(); save(); };
}

  const fc=document.getElementById('h_focus'); if(fc) fc.onclick=()=>{ S.focus=(S.focus===h.id?null:h.id); toast(S.focus===h.id?'\u2605 '+h.name+' is now your Focus hero':'Focus cleared'); openHeroSheet(h.id); save(); };
  const gr=document.getElementById('h_gear'); if(gr) gr.onclick=()=>openGearSheet(h.id);
  const sqw=document.getElementById('h_squads'); if(sqw) sqw.onclick=e=>{ const b=e.target.closest('button[data-sq]'); if(!b||b.disabled)return; toggleSquad(b.dataset.sq,h.id); renderHUD(); openHeroSheet(h.id); save(); };
  const del=document.getElementById('h_del'); if(del) del.onclick=()=>{ if(!confirm('Delete '+h.name+'? Equipped gear returns to your inventory.'))return; if(h.gear) SLOTS.forEach(s=>{ if(h.gear[s]){ S.inventory.push(h.gear[s]); h.gear[s]=null; } }); if(S.focus===id) S.focus=null; S.heroes=S.heroes.filter(x=>x.id!==id); SQUADS.forEach(s=>{ S.squads[s[0]]=squad(s[0]).filter(x=>x!==id); }); recalcCollection(); hideScrim(); render(); save(); };
}

/* ===== gear management ===== */
function openGearSheet(heroId){
  const h=S.heroes.find(x=>x.id===heroId); if(!h) return;
  if(!h.gear) h.gear={weapon:null,armor:null,boots:null,relic:null};
  let pickSlot=null;
  const sheet=document.getElementById('sheet');
  function gearRender(){
    let html='<h3>Gear · '+esc(h.name)+'</h3>'+
      '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"><div class="gscore" style="color:#ffcf5a">⦿ '+S.gold+'</div><div class="gscore" style="color:#5fe0c8">❖ '+S.dust+'</div><div class="gscore" style="color:#cdbcff">◇ '+S.stones+'</div><div class="gscore">⚔ '+powerOf(h)+'</div></div>';
    if(pickSlot){
      html+='<div style="color:var(--muted);font-weight:700;font-size:13px;margin-bottom:10px">Equip '+SLOTNAME[pickSlot]+'</div>';
      if(h.gear[pickSlot]) html+='<button class="go" id="g_unequip" style="background:var(--panel2);color:var(--ink);border:1px solid var(--line);margin-bottom:10px">Unequip current</button>';
      const items=S.inventory.filter(x=>x.slot===pickSlot).sort((a,b)=>gearPower(b)-gearPower(a));
      const commons=items.filter(x=>x.rarity==='common');
      if(commons.length) html+='<button class="go" id="g_salvagecommon" style="background:var(--panel2);color:var(--ink);border:1px solid var(--line);margin-bottom:10px">♻ Salvage all Common ('+commons.length+')</button>';
      if(!items.length) html+='<div class="empty">No '+SLOTNAME[pickSlot]+' gear yet.<br>Win stages or finish tasks to find some.</div>';
      else items.forEach(it=>{ html+='<div class="ginv"><div class="gi" style="color:'+RARCOLOR[it.rarity]+'">'+SLOTICON[it.slot]+'</div><div class="gb"><div class="gname" style="color:'+RARCOLOR[it.rarity]+'">'+gearName(it)+'</div><div class="gsub">Lv '+it.level+' · ⚡'+gearPower(it)+'</div></div><button class="pick" data-equip="'+it.id+'">Equip</button><button class="pick" data-salvage="'+it.id+'" style="margin-left:6px">♻'+salvageValue(it)+'</button></div>'; });
      html+='<button class="ghost" id="g_back" style="color:var(--ink)">Back</button>';
    } else {
      SLOTS.forEach(slot=>{ const g=h.gear[slot];
        if(g){ const max=gearMaxLvl(g), c=gearCostOf(g), p=PROMO[g.rarity], maxed=g.level>=max;
          const sub='Lv '+g.level+'/'+max+' · ⚡'+gearPower(g)+(maxed&&p?' · ↑'+cap(p.to)+': '+p.dust+'❖ '+p.stones+'◇ '+p.gold+'⦿':'');
          let action;
          if(!maxed){ const can=S.gold>=c.gold&&S.dust>=c.dust; action='<button class="gup" data-up="'+slot+'"'+(can?'':' disabled')+'>⬆ '+c.gold+'⦿ '+c.dust+'❖</button>'; }
          else if(p){ action='<button class="gup" data-promo="'+slot+'" style="background:'+RARCOLOR[p.to]+';color:#0c0e14"'+(canPromote(g)?'':' disabled')+'>↑ '+cap(p.to)+'</button>'; }
          else action='<span class="gsub" style="flex:0 0 auto;align-self:center">MAX</span>';
          html+='<div class="gslot"><div class="gi" style="color:'+RARCOLOR[g.rarity]+'">'+SLOTICON[slot]+'</div>'+
            '<div class="gb" data-pick="'+slot+'"><div class="gname" style="color:'+RARCOLOR[g.rarity]+'">'+gearName(g)+'</div><div class="gsub">'+sub+'</div></div>'+action+'</div>';
        } else {
          html+='<div class="gslot"><div class="gi">'+SLOTICON[slot]+'</div><div class="gb" data-pick="'+slot+'"><div class="gname">'+SLOTNAME[slot]+'</div><div class="gsub">Empty — tap to equip</div></div></div>';
        } });
      html+='<button class="ghost" id="g_close" style="color:var(--ink)">Done</button>';
    }
    sheet.innerHTML=html;
    sheet.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{ pickSlot=el.dataset.pick; gearRender(); });
    sheet.querySelectorAll('[data-up]').forEach(el=>el.onclick=()=>{ const slot=el.dataset.up,g=h.gear[slot],c=gearCostOf(g); if(g.level>=gearMaxLvl(g)){toast('Maxed — promote it');return;} if(S.gold<c.gold||S.dust<c.dust){toast('Not enough Gold/Dust');return;} S.gold-=c.gold;S.dust-=c.dust;g.level++; renderHUD(); gearRender(); save(); });
    sheet.querySelectorAll('[data-promo]').forEach(el=>el.onclick=()=>{ const slot=el.dataset.promo,g=h.gear[slot],p=PROMO[g.rarity]; if(!p){toast('Top rarity');return;} if(g.level<gearMaxLvl(g)){toast('Max the level first');return;} if(!canPromote(g)){toast('Need '+p.dust+'❖ '+p.stones+'◇ '+p.gold+'⦿');return;} S.dust-=p.dust;S.stones-=p.stones;S.gold-=p.gold; g.rarity=p.to; toast('Promoted to '+cap(p.to)+'!'); renderHUD(); gearRender(); save(); });
    sheet.querySelectorAll('[data-equip]').forEach(el=>el.onclick=()=>{ const it=S.inventory.find(x=>x.id===el.dataset.equip); if(!it)return; if(h.gear[pickSlot]) S.inventory.push(h.gear[pickSlot]); S.inventory=S.inventory.filter(x=>x.id!==it.id); h.gear[pickSlot]=it; pickSlot=null; renderHUD(); gearRender(); save(); });
    sheet.querySelectorAll('[data-salvage]').forEach(el=>el.onclick=()=>{ const it=S.inventory.find(x=>x.id===el.dataset.salvage); if(!it)return; const v=salvageValue(it); if(RARITY.indexOf(it.rarity)>=2 && !confirm('Salvage '+gearName(it)+' for '+v+' dust? This is permanent.')) return; S.inventory=S.inventory.filter(x=>x.id!==it.id); S.dust+=v; toast('Salvaged · +'+v+'❖'); renderHUD(); gearRender(); save(); });
    const sc=document.getElementById('g_salvagecommon'); if(sc) sc.onclick=()=>{ const commons=S.inventory.filter(x=>x.slot===pickSlot&&x.rarity==='common'); if(!commons.length)return; const v=commons.reduce((a,b)=>a+salvageValue(b),0); S.inventory=S.inventory.filter(x=>!(x.slot===pickSlot&&x.rarity==='common')); S.dust+=v; toast('Salvaged '+commons.length+' Common · +'+v+'❖'); renderHUD(); gearRender(); save(); };
    const un=document.getElementById('g_unequip'); if(un) un.onclick=()=>{ if(h.gear[pickSlot]){S.inventory.push(h.gear[pickSlot]); h.gear[pickSlot]=null;} pickSlot=null; gearRender(); save(); };
    const bk=document.getElementById('g_back'); if(bk) bk.onclick=()=>{ pickSlot=null; gearRender(); };
    const cl=document.getElementById('g_close'); if(cl) cl.onclick=()=>{ hideScrim(); render(); save(); };
  }
  gearRender(); showScrim('scrim');
}

/* image pick + downscale, preserving aspect ratio & transparency */
function pickImage(cb){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{ const file=inp.files[0]; if(!file)return; const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const sz=160; const cv=document.createElement('canvas'); cv.width=sz;cv.height=sz;
      const ctx=cv.getContext('2d'); const sc=Math.min(sz/im.width,sz/im.height); const w=Math.round(im.width*sc),hh=Math.round(im.height*sc);
      ctx.drawImage(im,(sz-w)/2,(sz-hh)/2,w,hh);
      cb(cv.toDataURL('image/png')); }; im.src=fr.result; };
    fr.readAsDataURL(file); };
  inp.click();
}
/* pick a full sprite sheet (capped width, keep transparency) */
function pickSheet(cb){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{ const file=inp.files[0]; if(!file)return; const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const cap=1536; const sc=Math.min(1,cap/im.width);
      const cv=document.createElement('canvas'); cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/png'), cv.width, cv.height); }; im.src=fr.result; };
    fr.readAsDataURL(file); };
  inp.click();
}

/* ===== IndexedDB store for sprite sheets (big, kept out of localStorage) ===== */
const IDB={ db:null,
  open(){ return new Promise((res,rej)=>{ if(IDB.db)return res(IDB.db); const r=indexedDB.open('lifequest',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('sheets'); r.onsuccess=()=>{IDB.db=r.result;res(IDB.db);}; r.onerror=()=>rej(r.error); }); },
  async put(k,v){ const db=await IDB.open(); return new Promise((res,rej)=>{ const tx=db.transaction('sheets','readwrite'); tx.objectStore('sheets').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); },
  async get(k){ const db=await IDB.open(); return new Promise((res,rej)=>{ const tx=db.transaction('sheets','readonly'); const rq=tx.objectStore('sheets').get(k); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); }); },
  async del(k){ const db=await IDB.open(); return new Promise(res=>{ const tx=db.transaction('sheets','readwrite'); tx.objectStore('sheets').delete(k); tx.oncomplete=()=>res(); }); }
};
const spriteImgs={};
async function loadSheet(heroId){
  if(spriteImgs[heroId]) return spriteImgs[heroId];
  let data; try{ data=await IDB.get('sheet_'+heroId); }catch(e){ data=null; }
  if(!data) return null;
  return new Promise(res=>{ const im=new Image(); im.onload=()=>{spriteImgs[heroId]=im;res(im);}; im.onerror=()=>res(null); im.src=data; });
}
function drawSpriteFrame(canvas,img,cfg,row,frame){
  const ctx=canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height);
  const sx=cfg.ox+frame*cfg.fw, sy=cfg.oy+row*cfg.fh;
  const sc=Math.min(canvas.width/cfg.fw, canvas.height/cfg.fh);
  const dw=cfg.fw*sc, dh=cfg.fh*sc, dx=(canvas.width-dw)/2, dy=(canvas.height-dh)/2;
  try{ ctx.imageSmoothingEnabled=true; ctx.drawImage(img,sx,sy,cfg.fw,cfg.fh,dx,dy,dw,dh); }catch(e){}
}
let spriteLoops=[];
function clearSpriteLoops(){ spriteLoops.forEach(id=>clearInterval(id)); spriteLoops=[]; }
function playSprite(canvas,img,cfg,anim,opts){
  opts=opts||{};
  const row=anim==='attack'?cfg.atkRow:cfg.idleRow;
  const frames=Math.max(1, anim==='attack'?cfg.atkFrames:cfg.idleFrames);
  let f=0; drawSpriteFrame(canvas,img,cfg,row,f);
  const iv=setInterval(()=>{ f++;
    if(f>=frames){ if(opts.once){ clearInterval(iv); spriteLoops=spriteLoops.filter(x=>x!==iv); if(opts.onDone)opts.onDone(); return; } f=0; }
    drawSpriteFrame(canvas,img,cfg,row,f);
  }, 1000/(cfg.fps||10));
  spriteLoops.push(iv);
  return iv;
}
const SPRITE_DEFAULTS={cols:7,fw:219,fh:214,ox:0,oy:30,idleRow:0,idleFrames:7,atkRow:2,atkFrames:7,fps:10};

/* ===== settings ===== */
document.getElementById('openSettings').onclick=()=>{
  const g=document.getElementById('themeGrid'); g.innerHTML='';
  Object.entries(THEMES).forEach(([k,t])=>{ const b=document.createElement('button'); if(k===S.theme)b.style.borderColor=t.a;
    b.innerHTML='<div class="swatch" style="background:linear-gradient(90deg,'+t.a+','+t.b+')"></div>'+t.name;
    b.onclick=()=>{S.theme=k;applyTheme();g.querySelectorAll('button').forEach(x=>x.style.borderColor='var(--line)');b.style.borderColor=t.a;save();render();};
    g.appendChild(b); });
  const dm=document.getElementById('doneModeSeg');
  dm.querySelectorAll('button').forEach(b=>{ b.classList.toggle('on',b.dataset.m===(S.doneMode||'bottom'));
    b.onclick=()=>{ S.doneMode=b.dataset.m; dm.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); save(); render(); }; });
  showScrim('setScrim');
};
document.getElementById('resetAll').onclick=()=>{ if(confirm('Wipe everything back to defaults?')){ S=seed(); applyTheme(); hideScrim(); renderHUD(); render(); save(); } };
document.getElementById('dlBackup').onclick=()=>{
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='life-quest-backup-'+todayStr()+'.json'; document.body.appendChild(a); a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},500); toast('Backup downloaded');
};
document.getElementById('importBackup').onclick=()=>{
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const fr=new FileReader();
    fr.onload=()=>{ try{ const data=JSON.parse(fr.result);
      if(!data.heroes||!data.dailies){ toast('That file doesn\'t look right'); return; }
      if(!confirm('Replace current progress with this backup?')) return;
      S=data; applyTheme(); hideScrim(); renderHUD(); render(); save(); toast('Backup restored');
    }catch(e){ toast('Could not read that file'); } };
    fr.readAsText(f); };
  inp.click();
};

/* ===== nav + helpers ===== */
document.querySelector('.nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.view;
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x===b)); render();};
function segPick(elId,cb,attr){ attr=attr||'d'; const el=document.getElementById(elId); if(!el)return;
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;cb(b.dataset[attr]);el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));}; }
function showScrim(id){document.getElementById(id).classList.add('show');}
function hideScrim(){document.querySelectorAll('.scrim').forEach(s=>s.classList.remove('show')); if(sheetPrevLoop){clearInterval(sheetPrevLoop);sheetPrevLoop=null;}}
document.querySelectorAll('.scrim').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)hideScrim();}));
function esc(s){return(s+'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function flash(el){const c=el.closest('.card');if(c){c.classList.add('flashgood');setTimeout(()=>c.classList.remove('flashgood'),500);}}
let toastT; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1700);}
function showAway(){
  if(!awayReport) return;
  const h=awayReport.hours, hl = h>=1 ? h.toFixed(1)+'h' : Math.round(h*60)+'m';
  document.getElementById('awayBox').innerHTML='<div class="ico">💤</div><h2>While you were away</h2><div class="big">+'+awayReport.exp+' ✦</div><p>Your active heroes each gained that much EXP over '+hl+' of idle leveling.</p><button id="awayCollect">Collect</button>';
  document.getElementById('awayModal').classList.add('show');
  document.getElementById('awayCollect').onclick=()=>document.getElementById('awayModal').classList.remove('show');
  awayReport=null;
}

/* ===== idle ticker (visible income while app is open) ===== */
function startTicker(){
  if(tick) clearInterval(tick);
  tick=setInterval(()=>{
    const now=Date.now();
    if(S.charge>0){
      const used=Math.min((now-S.lastSeen)/3600000, S.charge);
      if(used>0){ gainExp(used*expRate()); S.charge=+(S.charge-used).toFixed(4); }
      renderHUD(); save();
    }
    S.lastSeen=now;
  },TUNE.liveTickMs);
}
